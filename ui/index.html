<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangar</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/compiled_tailwind.css" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/components.css" />
  <script defer src="/core.js"></script>
  <script defer src="/components/tab-bar.js"></script>
  <script defer src="/components/project-popover.js"></script>
  <script defer src="/components/marketplace-panes.js"></script>
  <script defer src="/components/extensions-tab.js"></script>
  <script defer src="/components/iframe-deck.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <div id="hub-shell" class="hub-shell">
    <header id="chrome-bar" class="chrome-bar">
      <div id="workspace-pill" class="workspace-pill" title="Active Workspace">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 -960 960 960" fill="currentColor" class="agy-icon ws-icon" aria-hidden="true">
          <path d="M172.31-180Q142-180 121-201t-21-51.31V-707.69Q100-738 121-759t51.31-21H391.92l80,80H787.69Q818-700 839-679t21,51.31v375.38Q860-222 839-201t-51.31,21H172.31Zm0-60H787.69q5.39,0 8.85-3.46t3.46-8.85V-627.69q0-5.39-3.46-8.85T787.69-640H447.38l-80-80H172.31q-5.39,0-8.85,3.46T160-707.69v455.38q0,5.39 3.46,8.85t8.85,3.46Z"/>
        </svg>
        <span id="workspace-name" class="ws-name">Detecting...</span>
      </div>

      <nav id="tab-strip" class="tab-strip" aria-label="Primary or Top Pane Sidecar Tabs"></nav>

      <button
        id="top-overflow-btn"
        type="button"
        class="chrome-icon-btn tab-overflow-btn hidden"
        aria-label="More tabs"
        title="More tabs"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 -960 960 960" fill="currentColor" class="agy-icon" aria-hidden="true">
          <path d="M240-400q-33 0-56.5-23.5T160-480q0-33 23.5-56.5T240-560q33 0 56.5 23.5T320-480q0 33-23.5 56.5T240-400Zm240 0q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm240 0q-33 0-56.5-23.5T640-480q0-33 23.5-56.5T720-560q33 0 56.5 23.5T800-480q0 33-23.5 56.5T720-400Z"/>
        </svg>
      </button>

      <div class="chrome-actions">
        <button
          id="split-toggle-btn"
          type="button"
          class="chrome-icon-btn"
          aria-label="Toggle Split-Pane View"
          title="Toggle Split-Pane View"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 -960 960 960" fill="currentColor" class="agy-icon" aria-hidden="true">
            <path d="M212.31-527.31q-30.31,0-51.31-21t-21-51.31V-747.69Q140-778 161-799t51.31-21H747.69Q778-820 799-799t21,51.31v148.08q0,30.31-21,51.31t-51.31,21H212.31Zm0-60H747.69q5.39,0 8.85-3.46t3.46-8.85V-747.69q0-5.39-3.46-8.85T747.69-760H212.31q-5.39,0-8.85,3.46T200-747.69v148.08q0,5.39 3.46,8.85t8.85,3.46Zm0,447.31Q182-140 161-161t-21-51.31V-360q0-30.31 21-51.31t51.31-21H747.69q30.31,0 51.31,21T820-360v147.69Q820-182 799-161t-51.31,21H212.31Zm0-60H747.69q5.39,0 8.85-3.46t3.46-8.85V-360q0-5.39-3.46-8.85t-8.85-3.46H212.31q-5.39,0-8.85,3.46T200-360v147.69q0,5.39 3.46,8.85t8.85,3.46Z"/>
          </svg>
        </button>
        <button
          id="project-popover-trigger"
          type="button"
          popovertarget="project-popover"
          class="chrome-icon-btn"
          aria-label="Quick Project Sidecar Rules"
          title="Quick Project Sidecar Rules"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 -960 960 960" fill="currentColor" class="agy-icon" aria-hidden="true">
            <path d="M450-450H250q-12.75,0-21.37-8.63T220-480.01t8.62-21.37T250-510H450V-710q0-12.75 8.63-21.37T480.01-740t21.37,8.62T510-710v200H710q12.75,0 21.37,8.63T740-479.99t-8.62,21.37T710-450H510v200q0,12.75-8.63,21.37T479.99-220t-21.37-8.62T450-250V-450Z"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="project-popover" popover="auto" class="project-popover"></div>
    <div id="tab-overflow-popover" popover="auto" class="tab-overflow-popover"></div>

    <main id="main-viewport" class="main-viewport">
      <section id="empty-top-state" class="empty-deck-state slot-top hidden"></section>
      <div id="split-divider-group" class="split-divider-group hidden">
        <div
          id="split-resize-handle"
          class="split-resize-handle"
          role="separator"
          aria-orientation="horizontal"
          title="Drag to resize split pane"
        >
          <div class="sash-line"></div>
        </div>
        <div id="bottom-tab-bar" class="chrome-bar bottom-tab-bar">
          <nav id="bottom-tab-strip" class="tab-strip" aria-label="Bottom Pane Sidecar Tabs"></nav>
          <button
            id="bottom-overflow-btn"
            type="button"
            class="chrome-icon-btn tab-overflow-btn hidden"
            aria-label="More tabs"
            title="More tabs"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 -960 960 960" fill="currentColor" class="agy-icon" aria-hidden="true">
              <path d="M240-400q-33 0-56.5-23.5T160-480q0-33 23.5-56.5T240-560q33 0 56.5 23.5T320-480q0 33-23.5 56.5T240-400Zm240 0q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm240 0q-33 0-56.5-23.5T640-480q0-33 23.5-56.5T720-560q33 0 56.5 23.5T800-480q0 33-23.5 56.5T720-400Z"/>
            </svg>
          </button>
        </div>
      </div>
      <section id="empty-deck-state" class="empty-deck-state slot-bottom hidden"></section>
      <section id="store-view" class="store-view hidden" aria-label="Sidecar Extension Manager"></section>
    </main>
  </div>
</body>
</html>
