name: test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow starts this on its release/vX.Y.Z branch, so main's required checks run
  # on the release commit before it is pushed (see release.yml)
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows matters: links are NTFS junctions there, symlinks elsewhere
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm test
